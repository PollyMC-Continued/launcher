name: Build PollyMC-Continued

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Translation-only pushes don't build (tags and manual runs still do).
    paths-ignore:
      - "translations/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "translations/**"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on feature branches; main and tags always finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  ORT_VERSION: "1.22.0"
  WINDOWS_QT_VERSION: "6.11.2"

jobs:
  skip-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      skip_release: ${{ steps.check.outputs.skip_release }}
      skip_changelog: ${{ steps.check.outputs.skip_changelog }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          COMMITS=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            COMMITS=$(git log --format="%s %b" "${{ github.event.pull_request.base.sha }}".."${{ github.event.pull_request.head.sha }}")
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            COMMITS=$(git log --format="%s %b" "${{ github.event.before }}".."${{ github.event.after }}" 2>/dev/null || git log --format="%s %b" -1)
          else
            COMMITS=$(git log --format="%s %b" -1)
          fi
          echo "DEBUG: event_name=$GITHUB_EVENT_NAME"
          echo "DEBUG: commits=${COMMITS:0:500}"

          if grep -qF '[skip changelog]' <<< "$COMMITS"; then
            echo "skip_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_changelog=false" >> "$GITHUB_OUTPUT"
          fi

          # [skip-all] counts only on the newest commit, so older ones in a push range can't skip it.
          HEAD_MSG=$(git log -1 --format="%s %b" "${{ github.event.pull_request.head.sha || github.sha }}" 2>/dev/null || true)

          SKIP_REASON=""
          if grep -qF '[skip-all]' <<< "$HEAD_MSG"; then
            SKIP_REASON="[skip-all] in the newest commit"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            # Same-repo PRs are already built by the push event for their branch.
            SKIP_REASON="same-repo pull request (covered by the push run)"
          fi

          if [ -n "$SKIP_REASON" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DEBUG: skipping entire workflow: ${SKIP_REASON}."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "DEBUG: Workflow will run."
          fi

          if [[ "$GITHUB_REF" != "refs/heads/main" ]] || grep -qF '[skip release]' <<< "$COMMITS"; then
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            echo "DEBUG: skip_release=true (non-main branch or [skip release] tag)."
          else
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
            echo "DEBUG: No [skip release] found and branch is main."
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
            VERSION="${VERSION#v}"
            echo "DEBUG: Tag push detected, using tag version: ${VERSION}"
          else
            LATEST_TAG=$(git tag --sort=-v:refname --list 'v[0-9]*' | head -1 || echo "")
            if [ -z "$LATEST_TAG" ]; then
              BUMP_COMMITS=$(git log -1 --format="%s" 2>/dev/null || echo "")
              LATEST_TAG=$(sed 's/\r$//' CHANGELOG.md | grep -E '^## v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
              LATEST_TAG="${LATEST_TAG#"## "}"
              LATEST_TAG="${LATEST_TAG:-v0.0.0}"
            else
              # Only commit subjects are considered for versioning.
              BUMP_COMMITS=$(git log -1 --format="%s" 2>/dev/null || echo "")
            fi

            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            echo "DEBUG: Commits considered for version bump:"
            printf '%s\n' "$BUMP_COMMITS"

            if printf '%s\n' "$BUMP_COMMITS" | grep -qE '^[^:]+!:|^[^:]+:.*BREAKING CHANGE|BREAKING CHANGE'; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
              BUMP="major"
            elif printf '%s\n' "$BUMP_COMMITS" | grep -qiE '^(feat|feature|add|enhance)(\([^)]*\))?:[[:space:]]'; then
              MINOR=$((MINOR + 1)); PATCH=0
              BUMP="minor"
            else
              PATCH=$((PATCH + 1))
              BUMP="patch"
            fi

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "DEBUG: Latest tag: ${LATEST_TAG}"
            echo "DEBUG: Next version: ${VERSION} (${BUMP} bump)"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Computed version '${VERSION}' is not in X.Y.Z form."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  changelog-check:
    name: Verify changelog entry
    needs: [skip-check]
    if: needs.skip-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check for matching CHANGELOG.md section
        env:
          VERSION: ${{ needs.skip-check.outputs.version }}
          SKIP_CHANGELOG: ${{ needs.skip-check.outputs.skip_changelog }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Non-main branch: skipping changelog check."
            exit 0
          fi

          if [[ "$SKIP_CHANGELOG" == "true" ]]; then
            echo "Skipping changelog check: [skip changelog] found in the push range."
            exit 0
          fi

          EXPECTED_TAG="v${VERSION}"
          echo "Looking for '## ${EXPECTED_TAG}' in CHANGELOG.md ..."
          if [ "$(sed 's/\r$//' CHANGELOG.md | grep -Fxc "## ${EXPECTED_TAG}" || true)" -eq 0 ]; then
            echo "::error::CHANGELOG.md has no '## ${EXPECTED_TAG}' section, but the computed release version is ${EXPECTED_TAG}."
            echo "::error::Add a '## ${EXPECTED_TAG}' section (Added/Changed/Fixed/Removed), or put '[skip changelog]' in the commit message if no release note is needed."
            exit 1
          fi

          echo "Found matching CHANGELOG.md section for ${EXPECTED_TAG}."

  build-windows:
    name: Windows (MinGW)
    needs: [skip-check]
    if: needs.skip-check.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # Job-level so the Build step's ccache sees it.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-qt6-networkauth
            mingw-w64-ucrt-x86_64-qt6-websockets
            mingw-w64-ucrt-x86_64-extra-cmake-modules
            mingw-w64-ucrt-x86_64-tomlplusplus
            mingw-w64-ucrt-x86_64-qrencode
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-lz4
            mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-brotli
            mingw-w64-ucrt-x86_64-nghttp2
            mingw-w64-ucrt-x86_64-libssh2
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-libb2
            mingw-w64-ucrt-x86_64-libidn2
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-onnxruntime

      - name: Pin Qt to ${{ env.WINDOWS_QT_VERSION }}
        # MSYS2 is rolling and `pacman -S qt6-*` always installs the newest Qt.
        # Downgrade every installed Qt 6 package to the pinned version in ONE
        # transaction (Qt modules require matching versions of each other).
        run: |
          set -euo pipefail
          QT_PIN="$WINDOWS_QT_VERSION"
          MIRROR="https://mirror.msys2.org/mingw/ucrt64"

          echo "Installed Qt packages before pinning:"
          pacman -Q | grep -E '^mingw-w64-ucrt-x86_64-qt6-' || true

          curl -fsSL --retry 3 "$MIRROR/" -o /tmp/ucrt64-index.html

          mapfile -t PKGS < <(pacman -Qq | grep -E '^mingw-w64-ucrt-x86_64-qt6-')
          if [ "${#PKGS[@]}" -eq 0 ]; then
            echo "::error::No Qt 6 packages are installed; nothing to pin."
            exit 1
          fi

          URLS=()
          MISSING=()
          for pkg in "${PKGS[@]}"; do
            # Newest packaging revision of the pinned version, e.g. <pkg>-6.11.2-1-any.pkg.tar.zst
            file=$(grep -oE "href=\"${pkg}-${QT_PIN}-[0-9]+-any\.pkg\.tar\.zst\"" /tmp/ucrt64-index.html \
                   | sed -E 's/^href="//; s/"$//' | sort -V | tail -n1 || true)
            if [ -z "$file" ]; then
              MISSING+=("$pkg")
            else
              URLS+=("$MIRROR/$file")
            fi
          done

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::No ${QT_PIN} build found on the MSYS2 mirror for: ${MISSING[*]}"
            echo "::error::Mixing Qt versions would break the build, so aborting. The mirror may have pruned ${QT_PIN}."
            exit 1
          fi

          printf '%s\n' "${URLS[@]}"
          # One transaction so Qt's inter-module version dependencies resolve together.
          pacman -U --noconfirm "${URLS[@]}"

          # Prevent any later pacman call in this job from upgrading Qt again.
          IGNORE=$(printf '%s ' "${PKGS[@]}")
          sed -i "s|^#\?IgnorePkg.*|IgnorePkg = ${IGNORE}|" /etc/pacman.conf

          echo "Installed Qt packages after pinning:"
          pacman -Q | grep -E '^mingw-w64-ucrt-x86_64-qt6-' || true

          GOT=$(/ucrt64/bin/qmake6 -query QT_VERSION | tr -d '\r')
          if [ "$GOT" != "$QT_PIN" ]; then
            echo "::error::Qt pin failed: expected ${QT_PIN}, qmake6 reports ${GOT}."
            exit 1
          fi
          echo "Qt pinned to ${GOT}"

      - name: Record exact toolchain versions (build-env.txt)
        # MSYS2 is a rolling release and `update: true` builds with whatever is
        # current on run day. Recording the exact package set makes
        # "works there / crashes here" reports diagnosable after the fact; the
        # file also ships inside the portable zip for bug reports.
        run: |
          pacman -Q | sort > "$GITHUB_WORKSPACE/build-env.txt"
          echo "::group::Exact toolchain versions"
          cat "$GITHUB_WORKSPACE/build-env.txt"
          echo "::endgroup::"

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          # Unique key per run (cache entries are immutable); restore-keys warms from the latest.
          key: ccache-windows-${{ github.run_id }}
          restore-keys: |
            ccache-windows-

      - name: Build cmark from source
        run: |
          set -euo pipefail
          # MSYS2 dropped cmark for MINGW64; build the pinned release into /ucrt64.
          curl -fsSL --retry 3 -o /tmp/cmark.tar.gz \
            "https://github.com/commonmark/cmark/archive/refs/tags/0.31.2.tar.gz"
          tar -xzf /tmp/cmark.tar.gz -C /tmp
          cmake -S /tmp/cmark-0.31.2 -B /tmp/cmark-0.31.2/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=/ucrt64
          cmake --build /tmp/cmark-0.31.2/build
          cmake --install /tmp/cmark-0.31.2/build
          ls -la /ucrt64/bin/cmark.exe /ucrt64/lib/libcmark.dll.a /ucrt64/lib/cmake/cmark/

      - name: Download ONNX Runtime
        run: |
          set -euo pipefail
          # No MSYS2 package: use the official zip (MinGW links the DLL, the .lib is unused).
          curl -fsSL --retry 3 -o /tmp/ort.zip \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-win-x64-${ORT_VERSION}.zip"
          rm -rf /tmp/ort && mkdir -p /tmp/ort
          unzip -q -o /tmp/ort.zip -d /tmp/ort
          ORT_ROOT=$(echo /tmp/ort/onnxruntime-win-x64-*)
          test -f "$ORT_ROOT/lib/onnxruntime.dll"
          test -n "$(find "$ORT_ROOT/include" -name onnxruntime_cxx_api.h | head -1)"
          echo "ORT_ROOT=${ORT_ROOT}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          set -euo pipefail
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_SYSTEM_LIBRARY_PATH=/ucrt64/bin \
            -Donnxruntime_ROOT="$(cygpath -w "$ORT_ROOT")" \
            -DCMAKE_CXX_FLAGS="-Wno-error" \
            -DCMAKE_C_FLAGS="-Wno-error" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLauncher_BUILD_RELEASE=ON \
            -DLauncher_VERSION="${{ needs.skip-check.outputs.version }}" \
            -DLauncher_BUILD_NUMBER="${{ github.run_number }}" \
            -S . -B build

      - name: Build
        run: |
          set -euo pipefail
          ccache -z
          cmake --build build -j$(nproc)
          cmake --install build
          echo "=== ccache stats ==="
          ccache -s

      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-windows-${{ github.run_id }}

      - name: Bundle bot-server
        run: |
          set -euo pipefail
          rm -rf install/bot-server
          cp -r bot-server install/bot-server
          rm -f install/bot-server/.gitignore
          # node_modules is not bundled; installed on first use from the Bot Manager
          rm -rf install/bot-server/node_modules

      - name: Bundle ONNX Runtime
        run: |
          set -euo pipefail
          # windeployqt skips this DLL: copy it next to pollymc.exe before the DLL scan.
          cp -f "$ORT_ROOT"/lib/onnxruntime*.dll install/
          ls install/onnxruntime*.dll

      - name: Deploy Qt
        run: |
          set -euo pipefail
          cd install
          /ucrt64/bin/windeployqt6.exe --release pollymc.exe

          SYSTEM_DLLS="^(KERNEL32|KERNELBASE|USER32|GDI32|gdi32full|ADVAPI32|SHELL32|ole32|OLEAUT32|msvcrt|msvcp_win|ntdll|WS2_32|SHLWAPI|WINMM|VERSION|d3d11|d3d12|dxgi|dwmapi|DWrite|UxTheme|USP10|COMCTL32|COMDLG32|IMAPI2|MAPI32|netapi32|PSAPI|Secur32|WINTRUST|CRYPT32|IMAGEHLP|DBGHELP|PDHINST|WTSAPI32|WININET|MSWSOCK|IPHLPAPI|WS2HELP|bcrypt|RPCRT4|AUTHZ|MPR|USERENV|DNSAPI|WINHTTP)\.dll$"

          NEED_FIX=0
          for pass in $(seq 1 15); do
            ADDED=0
            for f in *.exe *.dll; do
              [ -f "$f" ] || continue
              while IFS= read -r dll; do
                [ -z "$dll" ] && continue
                if echo "$dll" | grep -qiE "^(api-ms-win-|ext-ms-win-)"; then continue; fi
                if [ -f "$dll" ]; then continue; fi
                if echo "$dll" | grep -iqE "$SYSTEM_DLLS"; then continue; fi
                if [ -f "/c/Windows/System32/$dll" ]; then continue; fi

                if [ -f "/ucrt64/bin/$dll" ]; then
                  cp -f "/ucrt64/bin/$dll" .
                  echo "Pass $pass: deployed $dll (needed by $f)"
                  ADDED=1
                else
                  echo "::error file=$f::$f is missing dependency: $dll"
                  NEED_FIX=1
                fi
              done < <(objdump -p "$f" 2>/dev/null | awk -F': ' '/^\s*DLL Name:/ {print $2}' | tr -d '\r')
            done
            [ "$ADDED" -eq 0 ] && break
          done

          echo "=== DLLs in install/ ==="
          ls -la *.dll
          [ "$NEED_FIX" -eq 0 ] || exit 1

      - name: Build NSIS installer
        run: |
          set -euo pipefail
          BUILD_DIR_WIN="$(cygpath -w "$(pwd)/install")"
          VERSION="${{ needs.skip-check.outputs.version }}"

          # Fail if the installer name placeholder no longer matches.
          if ! grep -q 'PollyMC-Continued-[^ ]*-Setup' pollymc_installer.nsi; then
            echo "::error::Expected placeholder 'PollyMC-Continued-*-Setup' not found in pollymc_installer.nsi"
            exit 1
          fi

          sed "s/PollyMC-Continued-[^ ]*-Setup/PollyMC-Continued-${VERSION}-Windows-Setup/" \
            pollymc_installer.nsi > pollymc_installer_versioned.nsi

          # NSIS plugin folders vary between MSYS2 builds: register each with its target switch.
          NSIS_PLUGINS=/ucrt64/share/nsis/Plugins
          echo "=== NSIS plugin layout ==="
          find "$NSIS_PLUGINS" -name 'nsExec.dll'
          if [ -z "$(find "$NSIS_PLUGINS" -name 'nsExec.dll' | head -1)" ]; then
            echo "::error::nsExec.dll not found under $NSIS_PLUGINS (is mingw-w64-ucrt-x86_64-nsis installed?)"
            exit 1
          fi

          : > nsis_plugin_dirs.nsh
          for d in "$NSIS_PLUGINS"/*/; do
            d="${d%/}"
            case "$(basename "$d")" in
              amd64-unicode) SWITCH=/amd64-unicode ;;
              x86-unicode|unicode) SWITCH=/x86-unicode ;;
              x86-ansi|ansi) SWITCH=/x86-ansi ;;
              *) continue ;;
            esac
            echo "!addplugindir $SWITCH \"$(cygpath -m "$d")\"" >> nsis_plugin_dirs.nsh
          done
          cat nsis_plugin_dirs.nsh

          # Prepend to the script itself (-X flags are dropped by the MSYS2 wrapper).
          cat nsis_plugin_dirs.nsh pollymc_installer_versioned.nsi > pollymc_installer_versioned.nsi.tmp
          mv pollymc_installer_versioned.nsi.tmp pollymc_installer_versioned.nsi

          makensis \
            "-DBUILD_DIR=${BUILD_DIR_WIN}" \
            "-DVERSION=${VERSION}" \
            "pollymc_installer_versioned.nsi"

          ls -la PollyMC-Continued-*-Setup.exe || (echo "ERROR: Installer not found!" && exit 1)

      - name: Smoke-test installed binary (missing DLLs + startup + crash codes)
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Filter "PollyMC-Continued-*-Setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No installer found at $env:GITHUB_WORKSPACE" }

          $installDir = Join-Path $env:RUNNER_TEMP "PollyMC-Test"
          Write-Host "Silently installing $($installer.Name) to $installDir ..."
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru -NoNewWindow
          Write-Host "Installer exit code: $($proc.ExitCode)"

          $exePath = Join-Path $installDir "pollymc.exe"
          if (-not (Test-Path $exePath)) {
            $exePath = Join-Path $installDir "PollyMC-Continued" "pollymc.exe"
          }
          if (-not (Test-Path $exePath)) { throw "pollymc.exe not found after installation" }
          $exeDir = Split-Path -Parent $exePath

          # Isolated data dir => deterministic location for the launcher's own log file.
          $dataDir = Join-Path $env:RUNNER_TEMP "PollyMC-Test-Data"
          if (Test-Path $dataDir) { Remove-Item $dataDir -Recurse -Force }
          New-Item -ItemType Directory -Path $dataDir | Out-Null

          $stderrFile = Join-Path $env:RUNNER_TEMP "pollymc_stderr.txt"
          if (Test-Path $stderrFile) { Remove-Item $stderrFile -Force }

          $startTime = Get-Date

          function Show-Diagnostics {
            param([string]$Label)
            Write-Host "::error::$Label"
            $bootLog = Join-Path $exeDir "boot-debug.log"
            if (Test-Path $bootLog) {
              Write-Host "=== boot-debug.log (last 60 lines) ==="
              Get-Content $bootLog | Select-Object -Last 60 | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "boot-debug.log was NOT created - the process never reached main() (loader-level failure)."
            }
            $appLog = Join-Path $dataDir "logs\PollyMC-0.log"
            if (Test-Path $appLog) {
              Write-Host "=== launcher log (last 40 lines) ==="
              Get-Content $appLog | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
            }
            if (Test-Path $stderrFile) {
              $stderr = Get-Content $stderrFile
              if ($stderr) { Write-Host "=== stderr ===`n$stderr" }
            }
            $events = Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$startTime} -MaxEvents 20 -ErrorAction SilentlyContinue
            foreach ($event in $events) {
              if ($event.Message -match "pollymc") {
                Write-Host "EventLog: $($event.TimeCreated) -- $($event.Message)"
                if ($event.Message -match "(?i)([a-zA-Z0-9_-]+\.dll)") {
                  Write-Host "Faulting/missing module: $($matches[1])"
                }
              }
            }
          }

          function Test-StartupCompleted {
            $appLog = Join-Path $dataDir "logs\PollyMC-0.log"
            if (-not (Test-Path $appLog)) { return $false }
            return ((Get-Content $appLog -Raw -ErrorAction SilentlyContinue) -match "Log initialized")
          }

          # A healthy build stays alive for the window (first-run UI) and MUST have
          # finished early startup: logs/PollyMC-0.log exists and contains
          # "<> Log initialized". Anything else is a shipping blocker.
          $process = Start-Process -FilePath $exePath -ArgumentList "-d", "`"$dataDir`"" -PassThru -RedirectStandardError $stderrFile
          $exited = $process.WaitForExit(10000)

          if (-not $exited) {
            $process.Kill()
            $process.WaitForExit()
            if (Test-StartupCompleted) {
              Write-Host "pollymc.exe ran for 10s and completed early startup (log file created) - OK"
            } else {
              Show-Diagnostics "pollymc.exe ran 10s but never created its log file - early startup is broken"
              throw "Startup smoke test failed: no logs/PollyMC-0.log containing 'Log initialized'"
            }
          } else {
            $exitCode = $process.ExitCode
            $exitHex = "0x{0:X8}" -f ($exitCode -band [uint32]::MaxValue)
            Show-Diagnostics "pollymc.exe exited during the startup window with code $exitCode ($exitHex)"
            if ($exitCode -eq -1073741515) {
              throw "pollymc.exe failed - missing DLL (STATUS_DLL_NOT_FOUND, 0xC0000135)"
            }
            throw "pollymc.exe failed - abnormal exit code $exitCode ($exitHex) during startup (crash or qFatal)"
          }

      - name: Zip portable build
        run: |
          set -euo pipefail
          VERSION="${{ needs.skip-check.outputs.version }}"
          cd install
          ls -la pollymc.exe || (echo "ERROR: pollymc.exe not found in install!" && exit 1)
          # portable.txt marks a portable install (data dir, updater asset matching).
          cp "$GITHUB_WORKSPACE/program_info/portable.txt" portable.txt
          # Exact toolchain manifest, shipped with the build (see "Record exact
          # toolchain versions"); attach it to bug reports as-is.
          cp "$GITHUB_WORKSPACE/build-env.txt" build-env.txt
          # manifest.txt lists the top-level entries the updater installs.
          find . -mindepth 1 -maxdepth 1 -printf '%P\n' | sort > manifest.txt
          "/c/Program Files/7-Zip/7z.exe" a \
            "../PollyMC-Continued-${VERSION}-Windows-portable.zip" .
          cd ..
          ls -la PollyMC-Continued-*-Windows-portable.zip || (echo "ERROR: Zip not found!" && exit 1)

      - name: Smoke-test portable package (the artifact users run on Winlator & co.)
        shell: powershell
        run: |
          $zip = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Filter "PollyMC-Continued-*-Windows-portable.zip" | Select-Object -First 1
          if (-not $zip) { throw "Portable zip not found" }

          $portableDir = Join-Path $env:RUNNER_TEMP "PollyMC-Portable-Test"
          if (Test-Path $portableDir) { Remove-Item $portableDir -Recurse -Force }
          New-Item -ItemType Directory -Path $portableDir | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x $zip.FullName "-o$portableDir" -y | Out-Null

          $exePath = Join-Path $portableDir "pollymc.exe"
          if (-not (Test-Path $exePath)) { throw "pollymc.exe missing from the portable zip" }
          if (-not (Test-Path (Join-Path $portableDir "platforms\qwindows.dll"))) {
            throw "platforms/qwindows.dll missing from the portable zip - the app would die at startup with no log file"
          }

          function Show-PortableDiagnostics {
            $bootLog = Join-Path $portableDir "boot-debug.log"
            if (Test-Path $bootLog) {
              Write-Host "=== boot-debug.log (last 60 lines) ==="
              Get-Content $bootLog | Select-Object -Last 60 | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "boot-debug.log was NOT created - the process never reached main()."
            }
          }

          # portable.txt is included in the zip, so the data dir (and logs/) land
          # in the extraction folder itself - exactly how Winlator users run it.
          $proc = Start-Process -FilePath $exePath -WorkingDirectory $portableDir -PassThru
          $exited = $proc.WaitForExit(10000)
          $appLog = Join-Path $portableDir "logs\PollyMC-0.log"

          if ($exited) {
            $exitCode = $proc.ExitCode
            $exitHex = "0x{0:X8}" -f ($exitCode -band [uint32]::MaxValue)
            Write-Host "::error::Portable build exited during startup with code $exitCode ($exitHex)"
            Show-PortableDiagnostics
            throw "Portable package failed the startup smoke test"
          }

          $proc.Kill()
          $proc.WaitForExit()

          if (-not ((Test-Path $appLog) -and ((Get-Content $appLog -Raw -ErrorAction SilentlyContinue) -match "Log initialized"))) {
            Write-Host "::error::Portable build never created its log file - early startup is broken"
            Show-PortableDiagnostics
            throw "Portable package failed the startup smoke test (no log file)"
          }
          Write-Host "Portable package OK: started up and created its log file"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PollyMC-Continued-Windows
          path: |
            PollyMC-Continued-*-Setup.exe
            PollyMC-Continued-*-Windows-portable.zip
          if-no-files-found: error

  build-linux:
    name: Linux (.deb + tarball)
    needs: [skip-check]
    if: needs.skip-check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Job-level so the Build step's ccache sees it; fixed path avoids the default dir.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo add-apt-repository -y universe
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-svg-dev qt6-5compat-dev qt6-networkauth-dev \
            qt6-websockets-dev qt6-base-dev-tools qt6-tools-dev libgl-dev \
            qt6-image-formats-plugins \
            extra-cmake-modules \
            libtomlplusplus-dev libcmark-dev libqrencode-dev cmark \
            libquazip1-qt6-dev libarchive-dev zlib1g-dev \
            libcurl4-openssl-dev libssl-dev libpng-dev \
            liblz4-dev liblzma-dev libbz2-dev libzstd-dev \
            gamemode-dev \
            patchelf \
            dpkg-dev \
            ccache

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          # Unique key per run (cache entries are immutable); restore-keys warms from the latest.
          key: ccache-linux-deb-${{ github.run_id }}
          restore-keys: |
            ccache-linux-deb-

      - name: Download ONNX Runtime
        run: |
          set -euo pipefail
          # No distro package: use the official build (version from ORT_VERSION).
          curl -fsSL --retry 3 -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          rm -rf /tmp/ort && mkdir -p /tmp/ort
          tar -xzf /tmp/ort.tgz -C /tmp/ort
          ORT_ROOT=$(echo /tmp/ort/onnxruntime-linux-x64-*)
          test -n "$(find "$ORT_ROOT/include" -name onnxruntime_cxx_api.h | head -1)"
          echo "ORT_ROOT=${ORT_ROOT}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          set -euo pipefail
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -Donnxruntime_ROOT="$ORT_ROOT" \
            -DCMAKE_CXX_FLAGS="-Wno-error" \
            -DCMAKE_C_FLAGS="-Wno-error" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLauncher_BUILD_RELEASE=ON \
            -DLauncher_VERSION="${{ needs.skip-check.outputs.version }}" \
            -DLauncher_BUILD_NUMBER="${{ github.run_number }}" \
            -S . -B build

      - name: Build
        run: |
          set -euo pipefail
          ccache -z
          cmake --build build -j$(nproc)
          echo "=== ccache stats ==="
          ccache -s

      - name: Build .deb package
        run: |
          set -euo pipefail
          # Distro packages must not ship the in-app updater, so build with it off.
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -Donnxruntime_ROOT="$ORT_ROOT" \
            -DLauncher_BUNDLE_ONNXRUNTIME=ON \
            -DCMAKE_CXX_FLAGS="-Wno-error" \
            -DCMAKE_C_FLAGS="-Wno-error" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLauncher_BUILD_RELEASE=ON \
            -DLauncher_VERSION="${{ needs.skip-check.outputs.version }}" \
            -DLauncher_BUILD_NUMBER="${{ github.run_number }}" \
            -DLauncher_UPDATER_GITHUB_REPO="" \
            -DLauncher_ENABLE_JAVA_DOWNLOADER=ON \
            -S . -B build-deb
          cmake --build build-deb -j$(nproc)
          cpack --config build-deb/CPackConfig.cmake -G DEB -B build-deb
          mv build-deb/*.deb "build-deb/PollyMC-Continued-${{ needs.skip-check.outputs.version }}-Linux-x86_64.deb"
          echo "=== DEB artifacts ==="
          ls -la build-deb/*.deb

      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-deb-${{ github.run_id }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: PollyMC-Continued-Linux-DEB
          path: build-deb/*.deb
          if-no-files-found: error

      - name: Install release layout
        run: |
          set -euo pipefail
          # Tarball only (the AppImage has its own job); the next step adds bot-server and libs.
          cmake --install build --prefix /tmp/pollymc

      - name: Create Linux binary tarball
        run: |
          set -euo pipefail
          VERSION="${{ needs.skip-check.outputs.version }}"
          # Same portable layout as the Windows zip (bot-server, portable.txt, manifest.txt).
          cp -r bot-server /tmp/pollymc/bin/bot-server
          rm -f /tmp/pollymc/bin/bot-server/.gitignore
          rm -rf /tmp/pollymc/bin/bot-server/node_modules

          # Bundle cmark, toml++ and qrencode in bin/ (RPATH $ORIGIN); cmark's SONAME differs per distro.
          # The cmark name is read from the binary; fail if any lib can't be resolved.
          CMARK_SO=$(ldd /tmp/pollymc/bin/pollymc | awk '/libcmark\.so/ {print $1; exit}')
          if [ -z "$CMARK_SO" ]; then
            echo "::error::pollymc does not link libcmark; cannot determine what to bundle."
            exit 1
          fi
          BUNDLE_LIBS="$CMARK_SO libtomlplusplus.so.3 libqrencode.so.4"
          for lib in $BUNDLE_LIBS; do
            SRC=$(ldconfig -p 2>/dev/null | awk -v n="$lib" '$1==n {print $NF; exit}')
            if [ -z "$SRC" ]; then
              echo "::error::Could not resolve $lib on the build runner; install the matching package in the 'Install Dependencies' step."
              exit 1
            fi
            cp -L "$SRC" /tmp/pollymc/bin/
            echo "DEBUG: bundled $lib <- $SRC"
          done

          # ONNX Runtime next to the binary; cp -d keeps the SONAME symlinks.
          ORT_SO=$(find "$ORT_ROOT/lib" -type f -name 'libonnxruntime.so.*' | head -1)
          if [ -z "$ORT_SO" ]; then
            echo "::error::Could not find libonnxruntime.so under $ORT_ROOT/lib."
            exit 1
          fi
          cp -d "$ORT_ROOT"/lib/libonnxruntime.so* /tmp/pollymc/bin/
          ORT_BASENAME=$(basename "$ORT_SO")
          echo "DEBUG: bundled onnxruntime <- $ORT_SO"
          ls -la /tmp/pollymc/bin/ | grep onnxruntime

          cp "$GITHUB_WORKSPACE/program_info/portable.txt" /tmp/pollymc/portable.txt
          find /tmp/pollymc -mindepth 1 -maxdepth 1 -printf '%P\n' | sort > /tmp/pollymc/manifest.txt
          tar -czf "PollyMC-Continued-${VERSION}-Linux-x86_64.tar.gz" -C /tmp/pollymc .
          ls -la PollyMC-Continued-*-Linux-x86_64.tar.gz

          # Check the bundled libs really are in bin/ of the tarball.
          tar -tzf "PollyMC-Continued-${VERSION}-Linux-x86_64.tar.gz" | sed 's|^\./||' > /tmp/tarball.list
          for f in $BUNDLE_LIBS "$ORT_BASENAME" libonnxruntime.so.1; do
            if ! grep -qx "bin/$f" /tmp/tarball.list; then
              echo "::error::bin/$f is missing from the packaged tarball"
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PollyMC-Continued-Linux
          path: PollyMC-Continued-${{ needs.skip-check.outputs.version }}-Linux-x86_64.tar.gz
          if-no-files-found: error

  build-appimage:
    name: Linux AppImage (glibc 2.35)
    needs: [skip-check]
    if: needs.skip-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 22.04 container, not the 24.04 runner: pins the glibc floor to 2.35 (24.04 needs >= 2.38).
    container: ubuntu:22.04
    permissions:
      contents: read
    # Container jobs default to dash, which lacks pipefail: force bash.
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      # Raise (never lower) if the bundled Qt ever needs newer symbol versions.
      APPIMAGE_MAX_GLIBC: "2.35"
      # Qt from aqt (jammy's 6.2 is too old). The cache key covers the module list.
      QT_VERSION: "6.8.3"
      QT_ARCH: "linux_gcc_64"
      QT_MODULES: "qtimageformats qtnetworkauth qtwebsockets"
      QT_CACHE_KEY: "qt-6.8.3-linux_gcc_64-imgfmt-netauth-wsockets"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # No Qt dev packages (jammy's 6.2 is too old; Qt comes from aqt). cmark needs both packages.
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            git curl ca-certificates \
            extra-cmake-modules libgl-dev libvulkan-dev \
            default-jdk-headless \
            libcmark-dev cmark libqrencode-dev libarchive-dev \
            zlib1g-dev libcurl4-openssl-dev libssl-dev libpng-dev \
            liblz4-dev liblzma-dev libbz2-dev libzstd-dev \
            gamemode-dev libgamemode0 \
            patchelf ccache \
            file squashfs-tools \
            libglib2.0-0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libegl1 libgl1 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-glx0 libxcb-shm0 libxcb-util1
          # Last group: runtime libs for the Qt tools and linuxdeploy. Also needed: a JDK (jar builds),
          # libvulkan-dev (HardwareInfo), libgamemode0 (linking), file + squashfs-tools (appimagetool).

      - name: Install CMake
        run: |
          set -euo pipefail
          # jammy's CMake 3.22 is too old (>= 3.25 needed); use the 24.04 runner's 3.28.3.
          CMAKE_VERSION=3.28.3
          curl -fsSL --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" \
            -o /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          echo "/opt/cmake/bin" >> "$GITHUB_PATH"
          echo "cmake $(/opt/cmake/bin/cmake --version | head -1)"

      - name: Install tomlplusplus
        run: |
          set -euo pipefail
          # jammy has no toml++ package. It is header-only: copy the headers and write the .pc by hand.
          TOMLPP_VERSION=3.4.0
          curl -fsSL --retry 3 -o /tmp/tomlplusplus.tar.gz \
            "https://github.com/marzer/tomlplusplus/archive/refs/tags/v${TOMLPP_VERSION}.tar.gz"
          rm -rf "/tmp/tomlplusplus-${TOMLPP_VERSION}"
          tar -xzf /tmp/tomlplusplus.tar.gz -C /tmp
          # Single-header variant: toml.hpp plus the impl/ headers it needs.
          install -d /usr/local/include
          cp -r "/tmp/tomlplusplus-${TOMLPP_VERSION}/include/toml++" /usr/local/include/
          install -d /usr/local/lib/pkgconfig
          cat > /usr/local/lib/pkgconfig/tomlplusplus.pc <<EOF
          prefix=/usr/local
          includedir=\${prefix}/include

          Name: tomlplusplus
          Description: TOML config file parser and serializer for C++
          URL: https://marzer.github.io/tomlplusplus
          Version: ${TOMLPP_VERSION}
          Cflags: -I\${includedir} -DTOML_HEADER_ONLY=1
          EOF
          pkg-config --modversion tomlplusplus
          pkg-config --cflags tomlplusplus

      - name: Cache Qt
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/qt
          key: ${{ env.QT_CACHE_KEY }}

      - name: Install Qt
        run: |
          set -euo pipefail
          # Not install-qt-action: its Python needs glibc 2.38 and this container has 2.35.
          find_qmake() {
            find "$RUNNER_TEMP/qt" -maxdepth 4 \
              \( -name qmake -o -name qmake6 \) 2>/dev/null | head -n1 || true
          }
          QMAKE=$(find_qmake)
          if [ -n "$QMAKE" ]; then
            echo "Reusing the cached Qt: $QMAKE"
          else
            apt-get install -y --no-install-recommends python3 python3-pip
            # Pinned so a new aqt release can't change the bundled Qt.
            python3 -m pip install --no-cache-dir "aqtinstall==3.3.0"
            mkdir -p "$RUNNER_TEMP/qt"
            # Qt 6.8.3 needs at most GLIBC_2.28, so it keeps the glibc floor.
            python3 -m aqt install-qt linux desktop "$QT_VERSION" "$QT_ARCH" \
              -m $QT_MODULES \
              --outputdir "$RUNNER_TEMP/qt"
            QMAKE=$(find_qmake)
          fi
          if [ -z "$QMAKE" ]; then
            echo "::error::aqt reported success but no qmake was installed under $RUNNER_TEMP/qt"
            exit 1
          fi
          # Derive the root from qmake so a layout change fails loudly.
          QT_ROOT=$(dirname "$(dirname "$QMAKE")")
          "$QMAKE" -query QT_VERSION
          echo "QT_ROOT=${QT_ROOT}" >> "$GITHUB_ENV"
          echo "${QT_ROOT}/bin" >> "$GITHUB_PATH"
          # linuxdeploy uses ldd, so Qt's lib dir must be on LD_LIBRARY_PATH.
          echo "LD_LIBRARY_PATH=${QT_ROOT}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "QT_PLUGIN_PATH=${QT_ROOT}/plugins" >> "$GITHUB_ENV"
          echo "QML2_IMPORT_PATH=${QT_ROOT}/qml" >> "$GITHUB_ENV"

      - name: Download ONNX Runtime
        run: |
          set -euo pipefail
          # Same official ONNX Runtime build as build-linux (version from ORT_VERSION).
          curl -fsSL --retry 3 -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          rm -rf /tmp/ort && mkdir -p /tmp/ort
          tar -xzf /tmp/ort.tgz -C /tmp/ort
          ORT_ROOT=$(echo /tmp/ort/onnxruntime-linux-x64-*)
          test -n "$(find "$ORT_ROOT/include" -name onnxruntime_cxx_api.h | head -1)"
          echo "ORT_ROOT=${ORT_ROOT}" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          # Own cache namespace: different compiler and Qt than build-linux.
          key: ccache-linux-appimage-${{ github.run_id }}
          restore-keys: |
            ccache-linux-appimage-

      - name: Configure
        run: |
          set -euo pipefail
          echo "QT_ROOT=${QT_ROOT}" >> "$GITHUB_ENV"
          QMAKE=$(command -v qmake6 || command -v qmake || true)
          echo "QMAKE=${QMAKE}" >> "$GITHUB_ENV"
          if [ -z "$QMAKE" ]; then
            echo "::error::qmake not found in PATH"
            exit 1
          fi
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -Donnxruntime_ROOT="$ORT_ROOT" \
            -DCMAKE_PREFIX_PATH="${QT_ROOT}/lib/cmake" \
            -DCMAKE_CXX_FLAGS="-Wno-error" \
            -DCMAKE_C_FLAGS="-Wno-error" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLauncher_BUILD_RELEASE=ON \
            -DLauncher_VERSION="${{ needs.skip-check.outputs.version }}" \
            -DLauncher_BUILD_NUMBER="${{ github.run_number }}" \
            -S . -B build

      - name: Build
        run: |
          set -euo pipefail
          ccache -z
          cmake --build build -j$(nproc)
          echo "=== ccache stats ==="
          ccache -s

      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-appimage-${{ github.run_id }}

      - name: Cache linuxdeploy
        uses: actions/cache@v5
        with:
          path: |
            linuxdeploy-x86_64.AppImage
            linuxdeploy-plugin-qt-x86_64.AppImage
          key: linuxdeploy-continuous-${{ runner.os }}
          restore-keys: |
            linuxdeploy-continuous-

      - name: Create AppImage
        run: |
          set -euo pipefail
          VERSION="${{ needs.skip-check.outputs.version }}"

          # curl instead of wget: the ubuntu:22.04 container image ships no wget.
          if [ ! -f linuxdeploy-x86_64.AppImage ]; then
            curl -fsSL --retry 3 "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -o linuxdeploy-x86_64.AppImage
          fi
          if [ ! -f linuxdeploy-plugin-qt-x86_64.AppImage ]; then
            curl -fsSL --retry 3 "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage" -o linuxdeploy-plugin-qt-x86_64.AppImage
          fi
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          cmake --install build --prefix /tmp/pollymc

          mkdir -p appdir/usr/bin appdir/usr/lib appdir/usr/share/applications appdir/usr/share/icons/hicolor/256x256/apps
          cp /tmp/pollymc/bin/pollymc appdir/usr/bin/
          cp /tmp/pollymc/bin/pollymc_filelink appdir/usr/bin/ 2>/dev/null || true
          cp -r /tmp/pollymc/share/* appdir/usr/share/ 2>/dev/null || true
          cp build/program_info/org.pollymc.PollyMC.desktop appdir/usr/share/applications/org.pollymc.PollyMC.desktop
          cp program_info/org.pollymc.PollyMC_256.png appdir/usr/share/icons/hicolor/256x256/apps/org.pollymc.PollyMC.png
          cp program_info/org.pollymc.PollyMC_256.png appdir/org.pollymc.PollyMC.png
          cp build/program_info/org.pollymc.PollyMC.desktop appdir/org.pollymc.PollyMC.desktop

          # applicationDirPath() = appdir/usr/bin at runtime inside the AppImage
          cp -r bot-server appdir/usr/bin/bot-server
          rm -f appdir/usr/bin/bot-server/.gitignore
          # node_modules is not bundled; installed on first use from the Bot Manager
          rm -rf appdir/usr/bin/bot-server/node_modules

          # Bundle critical libraries explicitly
          cp -L /usr/lib/x86_64-linux-gnu/libssl.so.* appdir/usr/lib/ 2>/dev/null || true
          cp -L /usr/lib/x86_64-linux-gnu/libcrypto.so.* appdir/usr/lib/ 2>/dev/null || true
          cp -L /usr/lib/x86_64-linux-gnu/libgamemode.so.* appdir/usr/lib/ 2>/dev/null || true
          cp -L /usr/lib/x86_64-linux-gnu/libgamemodeauto.so.* appdir/usr/lib/ 2>/dev/null || true
          # ONNX Runtime for the palette; the SONAME carries the version, so look it up.
          ORT_SO=$(find "$ORT_ROOT/lib" -type f -name 'libonnxruntime.so.*' | head -1)
          if [ -z "$ORT_SO" ]; then
            echo "::error::Could not find libonnxruntime.so under $ORT_ROOT/lib."
            exit 1
          fi
          cp -L "$ORT_SO" appdir/usr/lib/
          echo "DEBUG: bundled onnxruntime <- $ORT_SO"
          # Ship the archive's symlinks too (cp -d); linuxdeploy resolves via soname links.
          cp -d "$ORT_ROOT"/lib/libonnxruntime.so* appdir/usr/lib/
          ls -la appdir/usr/lib/ | grep onnxruntime

          # Plugin paths come from the aqt Qt prefix, not the system Qt.
          mkdir -p appdir/usr/plugins/imageformats
          cp -L "${QT_ROOT}"/plugins/imageformats/*.so appdir/usr/plugins/imageformats/ 2>/dev/null || true
          echo "DEBUG: bundled imageformats: $(ls appdir/usr/plugins/imageformats | tr '\n' ' ')"

          # Icon engine plugin so SVG icons render in menus (libqsvg.so only handles images).
          mkdir -p appdir/usr/plugins/iconengines
          cp -L "${QT_ROOT}"/plugins/iconengines/*.so appdir/usr/plugins/iconengines/ 2>/dev/null || true
          echo "DEBUG: bundled icon engines: $(ls appdir/usr/plugins/iconengines | tr '\n' ' ')"

          # No Breeze widget style: no build matches this Qt, so a stock style is used.
          echo "::warning::The Breeze widget style is not bundled (no Qt-matched build available); the AppImage uses a stock Qt style"

          # Fail loudly if upstream ever drops the unversioned link.
          test -e appdir/usr/lib/libonnxruntime.so || { echo "::error::appdir is missing libonnxruntime.so"; exit 1; }

          # Name the AppImage at creation (AppImage guidelines forbid "Linux" in the name).
          export LINUXDEPLOY_OUTPUT_APP_NAME="PollyMC-Continued"
          export LINUXDEPLOY_OUTPUT_VERSION="$VERSION"
          echo "DEBUG: LINUXDEPLOY_OUTPUT_APP_NAME=$LINUXDEPLOY_OUTPUT_APP_NAME LINUXDEPLOY_OUTPUT_VERSION=$LINUXDEPLOY_OUTPUT_VERSION"

          # QMAKE goes in the environment (the Qt plugin reads it); LD_LIBRARY_PATH lets
          # linuxdeploy find the bundled ONNX Runtime.
          QMAKE="$QMAKE" LD_LIBRARY_PATH="$PWD/appdir/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ./linuxdeploy-x86_64.AppImage \
            --appdir appdir \
            --plugin qt \
            --library appdir/usr/lib/libonnxruntime.so \
            --output appimage

          # Safety net: never ship a wrongly named AppImage.
          FINAL="PollyMC-Continued-${VERSION}-x86_64.AppImage"
          FILE=$(ls PollyMC*.AppImage 2>/dev/null | head -n1 || true)
          if [ -z "$FILE" ]; then
            echo "::error::No AppImage was produced. Directory contents:"
            ls -la
            exit 1
          fi
          echo "DEBUG: linuxdeploy produced '$FILE'"
          if [ "$FILE" != "$FINAL" ]; then
            echo "::warning::Renaming AppImage from '$FILE' to '$FINAL'"
            mv "$FILE" "$FINAL"
          fi
          ls -la "$FINAL"

      - name: Verify glibc floor
        run: |
          set -euo pipefail
          VERSION="${{ needs.skip-check.outputs.version }}"
          APPIMAGE="PollyMC-Continued-${VERSION}-x86_64.AppImage"

          # Fail if anything bundled needs a newer glibc than the supported floor.
          rm -rf /tmp/glibc-check
          # Keep the "./": the workspace is not on PATH.
          "./${APPIMAGE}" --appimage-extract >/dev/null
          mv squashfs-root /tmp/glibc-check

          # readelf fails on non-ELF files; || true keeps pipefail from aborting.
          symbol_versions() {
            find /tmp/glibc-check -type f -exec readelf -V {} + 2>/dev/null \
              | grep -oE "$1" || true
          }

          MAX=$(symbol_versions 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          echo "Highest glibc version required by the AppImage: ${MAX:-none}"
          if [ -z "$MAX" ]; then
            echo "::error::Could not read any GLIBC symbol versions from the AppImage payload"
            exit 1
          fi
          # Fail if the payload needs glibc newer than the floor (sort -V puts the smaller first).
          MAXV="${MAX#GLIBC_}"
          if [ "$MAXV" != "$APPIMAGE_MAX_GLIBC" ] \
             && [ "$(printf '%s\n%s\n' "$APPIMAGE_MAX_GLIBC" "$MAXV" | sort -V | head -1)" = "$APPIMAGE_MAX_GLIBC" ]; then
            echo "::error::The AppImage requires ${MAX} but the supported floor is GLIBC_${APPIMAGE_MAX_GLIBC}."
            echo "::error::Something bundled was compiled against a newer glibc: fix the build environment, or raise APPIMAGE_MAX_GLIBC deliberately."
            exit 1
          fi
          echo "glibc floor check passed (GLIBC_${APPIMAGE_MAX_GLIBC} or older required)"

          echo "GLIBCXX versions required (informational):"
          symbol_versions 'GLIBCXX_[0-9]+\.[0-9]+\.[0-9]+' | sort -uV | tail -3

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: PollyMC-Continued-AppImage
          path: PollyMC-Continued-${{ needs.skip-check.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

  linux-appimage-smoke:
    name: Linux AppImage (Ubuntu 22.04 smoke test)
    needs: [skip-check, build-appimage]
    if: needs.skip-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Oldest supported glibc: if it starts here, it starts on newer distros.
    container: ubuntu:22.04
    permissions:
      contents: read
    # Same reason as in build-appimage: `sh` on this image is dash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: PollyMC-Continued-AppImage

      - name: Run AppImage
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          APPIMAGE=$(ls PollyMC-Continued-*-x86_64.AppImage 2>/dev/null | head -n1 || true)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No AppImage found in the downloaded artifact:"
            ls -la
            exit 1
          fi
          echo "Testing ${APPIMAGE}"
          chmod +x "${APPIMAGE}"

          # Libraries the AppImage leaves to the host, plus xvfb and dbus for a desktop session.
          apt-get update
          apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 libdbus-1-3 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-glx0 libxcb-shm0 libxcb-util1 \
            xvfb dbus-x11

          # Extract-and-run avoids needing FUSE in the container.
          export APPIMAGE_EXTRACT_AND_RUN=1
          # Use the real xcb plugin under Xvfb (offscreen hides missing X libs), in
          # dbus-run-session so the bundled gamemode finds a bus.
          xvfb-run -a dbus-run-session -- ./"${APPIMAGE}" >/tmp/appimage-smoke.log 2>&1 &
          APP_PID=$!
          sleep 15
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            wait "$APP_PID" || true
            echo "::error::The AppImage exited during startup on Ubuntu 22.04 (glibc 2.35):"
            tail -40 /tmp/appimage-smoke.log
            exit 1
          fi
          echo "The AppImage ran for 15s on Ubuntu 22.04"
          kill "$APP_PID" 2>/dev/null || true

  linux-tarball-cross-distro:
    name: Linux tarball (cross-distro smoke test)
    needs: [skip-check, build-linux]
    if: needs.skip-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: PollyMC-Continued-Linux

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed
          pacman -S --noconfirm --needed \
            qt6-base qt6-networkauth qt6-svg qt6-websockets \
            libarchive libpng zlib zstd

      - name: Extract tarball and check bundle
        run: |
          set -euo pipefail
          TARBALL=$(ls PollyMC-Continued-*-Linux-x86_64.tar.gz | head -n1)
          if [ -z "$TARBALL" ]; then
            echo "::error::No Linux tarball artifact found"
            exit 1
          fi
          rm -rf /tmp/pollymc-test && mkdir -p /tmp/pollymc-test
          tar -xzf "$TARBALL" -C /tmp/pollymc-test
          cd /tmp/pollymc-test

          # libcmark must load from bin/ (RUNPATH=$ORIGIN/); Arch ships a different cmark.
          CMARK_SO=$(cd bin && ls libcmark.so.* 2>/dev/null | head -n1 || true)
          if [ -z "$CMARK_SO" ]; then
            echo "::error::No libcmark bundled in bin/ of the extracted tarball"
            exit 1
          fi
          # The container must not provide this SONAME, or the test proves nothing.
          if ldconfig -p | awk -v n="$CMARK_SO" '$1 == n { found = 1 } END { exit !found }'; then
            echo "::error::Arch container unexpectedly provides ${CMARK_SO}; the smoke test would be meaningless."
            exit 1
          fi
          for lib in "$CMARK_SO" libtomlplusplus.so.3 libqrencode.so.4; do
            if [ ! -f "bin/$lib" ]; then
              echo "::error::Bundled library $lib missing from bin/ in the extracted tarball"
              exit 1
            fi
          done
          if [ ! -e "bin/libonnxruntime.so.1" ]; then
            echo "::error::Bundled library libonnxruntime.so.1 missing from bin/ in the extracted tarball"
            exit 1
          fi
          if ldd bin/pollymc 2>&1 | grep -q "not found"; then
            echo "::error::Unresolved shared libraries in packaged binary:"
            ldd bin/pollymc 2>&1 | grep "not found"
            exit 1
          fi

      - name: Headless launch smoke test
        run: |
          set -euo pipefail
          cd /tmp/pollymc-test
          # Must still be alive after 10s (mirrors the Windows DLL test).
          QT_QPA_PLATFORM=offscreen ./bin/pollymc >/tmp/pollymc-smoke.log 2>&1 &
          APP_PID=$!
          sleep 10
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::pollymc exited during startup:"
            tail -40 /tmp/pollymc-smoke.log
            exit 1
          fi
          echo "pollymc ran for 10s in the cross-distro smoke test"
          kill "$APP_PID" 2>/dev/null || true

  build-macos:
    name: macOS (arm64)
    needs: [skip-check]
    if: needs.skip-check.outputs.skip != 'true'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      BUILD_TYPE: Release
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      # Job-level so the Build step's ccache sees it; fixed path avoids the default dir.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install ninja extra-cmake-modules cmark qrencode libarchive tomlplusplus lz4 xz zstd libpng ccache

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
          version: 6.11.*
          modules: qtimageformats qtnetworkauth qtwebsockets
          cache: true

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          # Unique key per run (cache entries are immutable); restore-keys warms from the latest.
          key: ccache-macos-${{ github.run_id }}
          restore-keys: |
            ccache-macos-

      - name: Download ONNX Runtime
        run: |
          set -euo pipefail
          # Version comes from the workflow-level ORT_VERSION env.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ort.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-arm64-${ORT_VERSION}.tgz"
          rm -rf "$RUNNER_TEMP/ort" && mkdir -p "$RUNNER_TEMP/ort"
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP/ort"
          ORT_ROOT=$(echo "$RUNNER_TEMP"/ort/onnxruntime-osx-arm64-*)
          ORT_HDR=$(find "$ORT_ROOT/include" -name onnxruntime_cxx_api.h | head -1)
          test -n "$ORT_HDR"
          echo "ORT header: $ORT_HDR"
          echo "ORT_ROOT=${ORT_ROOT}" >> "$GITHUB_ENV"
          # Real dylib (no symlinks or globs); skip .dSYM bundles, install_name_tool can't read them.
          ORT_DYLIB=$(find "$ORT_ROOT/lib" -type f -name 'libonnxruntime.*.dylib' -not -path '*.dSYM/*' | head -1)
          test -n "$ORT_DYLIB"
          echo "ORT_DYLIB=${ORT_DYLIB}" >> "$GITHUB_ENV"

      - name: Fix ONNX Runtime CMake config (known upstream bug)
        run: |
          set -euo pipefail
          mkdir -p "$ORT_ROOT/include/onnxruntime"
          ln -sf "$ORT_ROOT/include/"*.h "$ORT_ROOT/include/onnxruntime/"

      - name: Configure
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="/opt/homebrew/opt/libarchive/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install \
            -Donnxruntime_ROOT="$ORT_ROOT" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DLauncher_BUILD_RELEASE=ON \
            -DLauncher_BUILD_PLATFORM="${{ runner.os }}" \
            -DLauncher_ENABLE_JAVA_DOWNLOADER=ON \
            -DENABLE_LTO=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLauncher_VERSION="${{ needs.skip-check.outputs.version }}" \
            -DLauncher_BUILD_NUMBER="${{ github.run_number }}" \
            -S . -B build

      - name: Read and validate version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(cmake -N -LA build | sed -n 's/^Launcher_VERSION:STRING=//p')
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Launcher_VERSION: $VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match launcher version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -euo pipefail
          ccache -z
          cmake --build build --config "$BUILD_TYPE"
          echo "=== ccache stats ==="
          ccache -s

      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-${{ github.run_id }}

      - name: Import signing certificate
        env:
          APPLE_CODESIGN_CERT: ${{ secrets.APPLE_CODESIGN_CERT }}
          APPLE_CODESIGN_ID: ${{ secrets.APPLE_CODESIGN_ID }}
          APPLE_CODESIGN_PASSWORD: ${{ secrets.APPLE_CODESIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CODESIGN_CERT" && -z "$APPLE_CODESIGN_ID" ]]; then
            echo "No Apple signing certificate configured; the artifact will be ad-hoc signed."
            exit 0
          fi
          if [[ -z "$APPLE_CODESIGN_CERT" || -z "$APPLE_CODESIGN_ID" || -z "$APPLE_CODESIGN_PASSWORD" ]]; then
            echo "Apple signing secrets are only partially configured." >&2
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/pollymc-build.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/pollymc-codesign.p12"
          printf '%s' "$APPLE_CODESIGN_CERT" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_CODESIGN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_CODESIGN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CODESIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CODESIGN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Package app, ZIP, and DMG
        env:
          APPLE_CODESIGN_ID: ${{ secrets.APPLE_CODESIGN_ID }}
          APPLE_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          APPLE_NOTARIZE_TEAM_ID: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          ONNXRUNTIME_DYLIB: ${{ env.ORT_DYLIB }}
        run: |
          set -euo pipefail
          chmod +x packaging/macos/*.sh
          packaging/macos/package.sh \
            build \
            install-macos \
            dist-macos \
            "${{ steps.version.outputs.version }}" \
            "$BUILD_TYPE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PollyMC-Continued-macOS
          path: |
            dist-macos/PollyMC-Continued-${{ steps.version.outputs.version }}-macOS-arm64.zip
            dist-macos/PollyMC-Continued-${{ steps.version.outputs.version }}-macOS-arm64.dmg
            dist-macos/PollyMC-Continued-${{ steps.version.outputs.version }}-macOS-arm64.sha256
          if-no-files-found: error

      - name: Remove temporary signing keychain
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  build-arch:
    name: Arch package
    needs: [skip-check]
    if: needs.skip-check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update package database and install build tools
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed
          pacman -S --noconfirm --needed \
            base-devel git cmake ninja extra-cmake-modules \
            qt6-base qt6-5compat qt6-networkauth qt6-svg qt6-websockets \
            qt6-imageformats qt6-tools ccache \
            libarchive libpng qrencode openssl tomlplusplus zlib zstd \
            lz4 xz bzip2 gamemode mangohud \
            cmark jdk17-openjdk vulkan-headers

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-arch-${{ github.run_id }}
          restore-keys: |
            ccache-arch-

      - name: Build Arch package
        run: |
          set -euo pipefail
          # makepkg refuses to run as root; build as an unprivileged user.
          useradd -m builder
          # makepkg uses ccache only when BUILDENV enables it ('!ccache' by default).
          sed -i 's/!ccache/ccache/' /etc/makepkg.conf
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          VERSION="${{ needs.skip-check.outputs.version }}"
          # Point the PKGBUILD at the checked-out tree instead of a remote tarball.
          sed -i "s/pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          sed -i 's|source=.*|source=("${pkgname}-${pkgver}.tar.gz")|' packaging/arch/PKGBUILD
          sed -i "s/sha256sums=.*/sha256sums=('SKIP')/" packaging/arch/PKGBUILD
          tar --exclude-vcs --exclude=./build --exclude=./.ccache \
            --transform="s|^\./|PollyMC-Continued-${VERSION}/|" \
            -czf /tmp/pollymc-continued.tar.gz .
          # Build the tarball in /tmp and move it in: writing inside the archived tree made tar fail.
          mv "/tmp/pollymc-continued.tar.gz" "packaging/arch/pollymc-continued-${VERSION}.tar.gz"
          # No Arch package for ONNX Runtime: fetch the official build into packaging/arch/ort
          # (outside the source tarball).
          curl -fsSL --retry 3 -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          rm -rf packaging/arch/ort && mkdir -p packaging/arch/ort
          tar -xzf /tmp/ort.tgz -C packaging/arch/ort
          test -n "$(find packaging/arch/ort -name onnxruntime_cxx_api.h | head -1)"
          cd packaging/arch
          su builder -c "CCACHE_DIR='$GITHUB_WORKSPACE/.ccache' CCACHE_MAXSIZE=400M makepkg --noconfirm --force"
          # Rename to the branded name and drop the -debug package.
          rm -f pollymc-continued-debug-*.pkg.tar.zst
          mv "pollymc-continued-${VERSION}-1-x86_64.pkg.tar.zst" "PollyMC-Continued-${VERSION}-1-x86_64.pkg.tar.zst"

      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-arch-${{ github.run_id }}

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PollyMC-Continued-Arch
          path: packaging/arch/PollyMC-Continued-*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Release
    needs: [skip-check, changelog-check, build-windows, build-linux, linux-tarball-cross-distro, build-appimage, linux-appimage-smoke, build-macos, build-arch]
    if: >-
      !cancelled() &&
      needs.skip-check.outputs.skip != 'true' &&
      needs.skip-check.outputs.skip_release != 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write   # dispatches gh-pages.yml
    # Two quick pushes to main would otherwise compute the same next version.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List release files
        run: |
          set -euo pipefail
          ls -la PollyMC-Continued-* || true

      - name: Prepare release metadata
        id: prep
        run: |
          set -euo pipefail
          # Version comes from skip-check; a tag push uses the tag itself.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NEW_TAG="$GITHUB_REF_NAME"
          else
            NEW_TAG="v${{ needs.skip-check.outputs.version }}"
          fi
          echo "tag_name=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=PollyMC Continued ${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          set -euo pipefail
          TAG="${{ steps.prep.outputs.tag_name }}"

          # CHANGELOG.md uses CRLF; strip \r so awk pattern matching is reliable
          sed 's/\r$//' CHANGELOG.md > /tmp/changelog_lf.md

          awk -v ver="## ${TAG}" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' /tmp/changelog_lf.md > /tmp/section.md

          if [[ -s /tmp/section.md ]]; then
            # trim leading/trailing blank lines
            sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' /tmp/section.md > release_notes.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "_No changelog entry found for ${TAG}._" > release_notes.md
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CHANGELOG.md section found for ${TAG} - check that the version header matches exactly."
          fi

          echo "--- release_notes.md ---"
          cat release_notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          # Tag the commit that was built, not whatever the branch head is by now.
          target_commitish: ${{ github.sha }}
          name: "${{ steps.prep.outputs.release_name }}"
          body_path: release_notes.md
          generate_release_notes: false
          prerelease: ${{ github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' || contains(github.ref_name, '-rc') }}
          files: |
            PollyMC-Continued-*-Setup.exe
            PollyMC-Continued-*-Windows-portable.zip
            PollyMC-Continued-*-x86_64.AppImage
            PollyMC-Continued-*-Linux-x86_64.tar.gz
            PollyMC-Continued-*-macOS-arm64.zip
            PollyMC-Continued-*-macOS-arm64.dmg
            PollyMC-Continued-*-macOS-arm64.sha256
            PollyMC-Continued-*.deb
            PollyMC-Continued-*.pkg.tar.zst

      - name: Trigger apt/pacman repo deploy
        # GITHUB_TOKEN releases don't fire `on: release`, so dispatch gh-pages.yml (stable only).
        if: ${{ !(github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' || contains(github.ref_name, '-rc')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run gh-pages.yml --ref "${{ github.event.repository.default_branch }}" -f scope=repos

      - name: Update version in README
        run: |
          set -euo pipefail

          TAG="${{ steps.prep.outputs.tag_name }}"
          VERSION="${TAG#v}"

          # Current version(s) present in README
          CURRENT=$(grep -oE 'PollyMC-Continued-[0-9]+\.[0-9]+\.[0-9]+' README.md \
                    | head -1 | sed 's/PollyMC-Continued-//' || true)

          if [ "$CURRENT" = "$VERSION" ]; then
            echo "README already at ${VERSION}, nothing to do."
            exit 0
          fi

          if [ -z "$CURRENT" ]; then
            echo "::error::No 'PollyMC-Continued-X.Y.Z' pattern found in README.md."
            echo "::error::The README's artifact filename examples must follow that format."
            exit 1
          fi

          # Guard against downgrades (tag push of an older tag)
          NEWER=$(printf '%s\n%s\n' "$VERSION" "$CURRENT" | sort -V | tail -1)
          if [ "$NEWER" = "$CURRENT" ] && [ "$VERSION" != "$CURRENT" ]; then
            echo "::warning::README version ${CURRENT} is newer than tag ${VERSION}; skipping."
            exit 0
          fi

          # Rewrite only the version segment of PollyMC-Continued-<semver>- names.
          sed -i -E "s/PollyMC-Continued-[0-9]+\.[0-9]+\.[0-9]+-/PollyMC-Continued-${VERSION}-/g" README.md

          if git diff --quiet -- README.md; then
            echo "No changes after sed, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Chore: bump README version to ${VERSION} [skip-all]"

          # Tag pushes are detached: push to the default branch; branch pushes go back to their branch.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TARGET_BRANCH="${{ github.event.repository.default_branch }}"
          else
            TARGET_BRANCH="$GITHUB_REF_NAME"
          fi

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "Pushed version update to ${TARGET_BRANCH}."
              exit 0
            fi
            echo "Push rejected, pulling and rebasing (attempt ${attempt}/5)..."
            git pull --rebase origin "${TARGET_BRANCH}"
          done
          echo "::error::Failed to push version update after 5 attempts."
          exit 1
